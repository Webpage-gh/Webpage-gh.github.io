<!DOCTYPE html>
<html lang="zh_CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo URI Parser</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Geo URI Parser</h1>
    <form id="geoForm">
        <div class="form-group">
            <label for="latitude">纬度 (必填，范围 -90 到 90):</label>
            <input type="number" id="latitude" name="latitude" step="0.0001" required>
        </div>
        <div class="form-group">
            <label for="longitude">经度 (必填，范围 -180 到 180):</label>
            <input type="number" id="longitude" name="longitude" step="0.0001" required>
        </div>
        <div class="form-group">
            <label for="altitude">海拔高度 (可选，单位：米):</label>
            <input type="number" id="altitude" name="altitude">
        </div>
        <div class="form-group">
            <label for="uncertainty">位置不确定性 (可选，单位：米):</label>
            <input type="number" id="uncertainty" name="uncertainty">
        </div>
        <button type="submit">打开 Geo URI</button>
    </form>

    <script>
        // 获取URL中的参数
        const urlParams = new URLSearchParams(window.location.search);

        // 从URL中读取参数并填充到表单中
        document.getElementById('latitude').value = urlParams.get('latitude') || '';
        document.getElementById('longitude').value = urlParams.get('longitude') || '';
        document.getElementById('altitude').value = urlParams.get('altitude') || '';
        document.getElementById('uncertainty').value = urlParams.get('uncertainty') || '';

        // 提交表单时构造Geo URI并跳转
        document.getElementById('geoForm').addEventListener('submit', function(event) {
            event.preventDefault();

            // 获取输入值
            const latitude = document.getElementById('latitude').value;
            const longitude = document.getElementById('longitude').value;
            const altitude = document.getElementById('altitude').value;
            const uncertainty = document.getElementById('uncertainty').value;

            // 检查必填参数是否填写
            if (!latitude || !longitude) {
                alert('纬度和经度是必填项！');
                return;
            }

            // 构造Geo URI
            let geoUri = `geo:${latitude},${longitude}`;

            if (altitude) {
                geoUri += `,${altitude}`;
            }

            if (uncertainty) {
                geoUri += `;u=${uncertainty}`;
            }

            // 打开Geo URI
            window.location.href = geoUri;
        });
    </script>
</body>
</html>
