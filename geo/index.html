<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo URI 解析器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Geo URI 解析器</h1>
    <form id="geoForm">
        <div class="form-group">
            <label for="location">纬度,经度 (±90,±180)</label>
            <input type="text" id="location" name="location" required>
        </div>
        <div class="form-group">
            <label for="crs">坐标系：</label>
            <select id="crs" name="crs">
                <option value="GCJ02">GCJ02</option>
                <option value="WGS84">WGS84</option>
                <option value="BD09">BD09</option>
            </select>
        </div>
        <button type="submit">打开 Geo URI</button>
    </form>

    <script>
        // 获取URL中的参数
        const urlParams = new URLSearchParams(window.location.search);

        // 从URL中读取参数并填充到表单中
        document.getElementById('location').value = urlParams.get('location') || '';
        document.getElementById('crs').value = urlParams.get('crs') || 'GCJ02'; // 默认值为 GCJ02

        // 提交表单时构造Geo URI并跳转
        document.getElementById('geoForm').addEventListener('submit', function(event) {
            event.preventDefault();

            // 获取输入值
            const location = document.getElementById('location').value;
            const crs = document.getElementById('crs').value;

            // 使用正则表达式提取纬度和经度
            const regex = /(-?\d{1,3}\.\d+),\s*(-?\d{1,3}\.\d+)/;
            const match = location.match(regex);

            if (!match) {
                alert('请输入正确的纬度和经度格式（纬度,经度），例如：39.915,116.404');
                return;
            }

            const [_, latitude, longitude] = match;

            // 构造Geo URI
            let geoUri = `geo://${latitude},${longitude};crs=${crs}`;

            // 打开Geo URI
            window.location.href = geoUri;
        });
    </script>
</body>
</html>
